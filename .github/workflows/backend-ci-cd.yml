name: Backend Microservices CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: unitedpay-backend
  EKS_CLUSTER_NAME: unitedpay-prod-cluster

jobs:
  test-and-security:
    name: Unit Tests & SAST Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Test Suites
        run: |
          cd backend
          if [ -f pom.xml ]; then
            mvn clean test --batch-mode
          else
            echo "Skipping mvn test until pom.xml is committed"
          fi

      - name: Run Trivy Security Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'backend/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  build-and-deploy:
    name: Build Docker Images & Deploy to EKS
    needs: test-and-security
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Notify Deployment Readiness
        run: |
          echo "Ready for EKS deployment with image tag ${{ github.sha }}"
